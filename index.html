<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gymboard</title>
  <meta name="description" content="Your training program, ready for the gym.">
  <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0D10" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gymboard">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app" class="wrap"></main>

  <div id="timer" class="timer" hidden role="timer" aria-live="polite">
    <div class="timer-fill"></div>
    <div class="timer-body">
      <div class="timer-text"><span class="timer-time">0:00</span><span class="timer-label"></span></div>
      <button type="button" data-act="minus" aria-label="15 seconds less">−15</button>
      <button type="button" data-act="plus" aria-label="15 seconds more">+15</button>
      <button type="button" data-act="skip" class="skip">Skip</button>
    </div>
  </div>

  <nav class="tabbar" aria-label="Main">
    <a href="#/today" data-tab="today"><span>Today</span></a>
    <a href="#/program" data-tab="program"><span>Program</span></a>
    <a href="#/progress" data-tab="progress"><span>Progress</span></a>
    <a href="#/settings" data-tab="settings"><span>Settings</span></a>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>Gymboard needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
